<style>
:root{--bg:#eef1f4;--card:#fff;--text:#14202b;--muted:#5a6b7a;--line:#d5dde4;--f:#2a78d6;--l:#d92d20;--s:#ff8a00;--ft:#1f62b8;--lt:#b42318;--st:#a85800;--p0:#008300;--p1:#eda100;--p2:#7cb342;--p3:#e34948;--p4:#2a78d6;--r:#8b95a1;--w:#8d5a2b;--wf:#ffffff;--hi:#fff6d6;--ac:#b8600c;--sub:#f5f7f9;--gon:#16875e;--gonf:#fff;--wt:#7a4a1f;--k:#f5d33f;--kt:#7a5f00;--ok:#1baf7a;--okt:#137a55;--acc:#34c759;--acct:#1a7f37;--accf:#ffffff;--tint:9%;--no:#d92d20;--not:#b42318;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161c;--card:#19222b;--text:#e8eef3;--muted:#93a3b2;--line:#2a3745;--f:#3987e5;--l:#e5534b;--s:#ff9f1a;--ft:#6c9bff;--lt:#f47067;--st:#ffb347;--p0:#008300;--p1:#c98500;--p2:#8bc34a;--p3:#e66767;--p4:#3987e5;--r:#8b949e;--w:#c08a5a;--wf:#1a0f05;--hi:#3a3418;--ac:#f0a04b;--sub:#202b36;--gon:#26a873;--gonf:#06140e;--wt:#d4a373;--k:#f7dc6f;--kt:#f9e08a;--ok:#199e70;--okt:#4cc38a;--acc:#30d158;--acct:#30d158;--accf:#04210d;--tint:14%;--no:#e5534b;--not:#f47067;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161c;--card:#19222b;--text:#e8eef3;--muted:#93a3b2;--line:#2a3745;--f:#3987e5;--l:#e5534b;--s:#ff9f1a;--ft:#6c9bff;--lt:#f47067;--st:#ffb347;--p0:#008300;--p1:#c98500;--p2:#8bc34a;--p3:#e66767;--p4:#3987e5;--r:#8b949e;--w:#c08a5a;--wf:#1a0f05;--hi:#3a3418;--ac:#f0a04b;--sub:#202b36;--gon:#26a873;--gonf:#06140e;--wt:#d4a373;--k:#f7dc6f;--kt:#f9e08a;--ok:#199e70;--okt:#4cc38a;--acc:#30d158;--acct:#30d158;--accf:#04210d;--tint:14%;--no:#e5534b;--not:#f47067;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{overflow-x:hidden;overscroll-behavior-x:none;max-width:100%}
body{position:relative;touch-action:pan-y pinch-zoom}
.tabs,.tbl,.chart{touch-action:pan-x pan-y pinch-zoom}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:1.5rem;margin:6px 0 6px;letter-spacing:-.01em}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tsw{display:flex;align-items:center;gap:8px;font:inherit;font-size:.88rem;font-weight:600;color:var(--text);background:none;border:0;padding:6px 2px;cursor:pointer}
.tsw:focus-visible{outline:3px solid var(--f);outline-offset:2px;border-radius:8px}
.trk{position:relative;width:40px;height:22px;border-radius:99px;background:var(--line);border:1px solid var(--line);transition:background .15s}
.knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .15s}
.trk{background:color-mix(in srgb,var(--muted) 35%,var(--card));border:1.5px solid var(--muted)}.knob{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.45)}
.tsw[aria-checked="true"] .trk{background:var(--acc);border-color:var(--acc)}
.tsw[aria-checked="true"] .knob{transform:translateX(18px);background:#fff}
.races{margin:0 0 12px;padding-left:1.1rem;font-size:.95rem}
.mainG{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:10px;padding:10px 12px;margin:4px 0 10px}
.mainG .lbl{display:block;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.mainG b{font-size:1.15rem}
.mainG .md{color:var(--muted);font-weight:600;white-space:nowrap}
.mainG .md2{display:block;font-size:.88rem;color:var(--muted);margin-top:2px}
.rcat{font-size:.8rem;color:var(--muted)}
.prl{margin:0 0 8px;padding-left:1.1rem;font-size:.9rem;color:var(--muted)}
.prl li{margin:0 0 2px}
.vlbl{margin:0 0 2px;font-size:.85rem;font-weight:600;color:var(--muted)}
.card.gcard{padding:0;overflow:hidden}
.ghd{width:100%;display:flex;align-items:center;gap:10px;font:inherit;color:var(--text);background:none;border:0;padding:12px 14px;text-align:left;cursor:pointer}
.ghd:focus-visible{outline:3px solid var(--f);outline-offset:-3px}
.ghd .gt{flex:1;min-width:0}
.ghd .gt b{display:block;font-size:1.02rem}
.ghd .gt span{font-size:.85rem;color:var(--muted)}
.ghd .pb,.rpc .pb{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.ghd .pb.pA,.rpc .pb.pA{background:var(--acc);border-color:var(--acc);color:var(--accf)}
.ghd .pb.pT,.rpc .pb.pT{border-color:var(--acc);color:var(--acct)}
.ghd .pb.pC,.rpc .pb.pC{border-style:dashed;color:var(--muted)}
.ghd .chev{transition:transform .15s;color:var(--muted)}
.gcard.open .chev{transform:rotate(180deg)}
.gbody{padding:0 14px 12px;border-top:1px solid var(--line)}
.gbody>.fld:first-child{margin-top:10px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:0 14px 10px;margin:0 -14px;-webkit-overflow-scrolling:touch}
.tabs button{flex:0 0 auto;font:inherit;font-weight:600;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.tabs button.rest{border-style:dashed}
.tabs button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.tabs button:focus-visible{outline:3px solid var(--f);outline-offset:2px}
.mnav{border-bottom:1px solid var(--line);margin-bottom:12px;padding-bottom:12px;flex-wrap:wrap;overflow:visible}
.mnav button{flex:1 1 auto}
.wk button{font-size:.9rem;padding:7px 12px}
#sched[hidden]{display:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0 12px;font-size:.85rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:10px 0 4px}
.hd h2{margin:0;font-size:1.2rem}
.tag{font-size:.8rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--hi);border:1px solid var(--ac);white-space:nowrap}
.range{font-weight:600;margin:0 0 4px}
.note{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.92rem;margin:0 0 10px}
.note b{display:block;font-size:.8rem;color:var(--text);font-weight:700}
.wkt{margin-top:8px}.avn{margin-top:10px}.avn>b{display:block;font-size:.8rem;color:var(--text);font-weight:700}.avn ul{margin:4px 0 0;padding-left:1.2rem;font-size:.9rem}.avn li{margin:2px 0}.avn li b{display:inline;font-size:inherit;color:inherit;font-weight:600}.avn ul.avs{margin:2px 0 4px;padding-left:1.4rem;list-style:'– '}.wkh{font-size:.8rem;color:var(--muted)}.wkh b{display:inline;color:var(--text);font-weight:700}.wkt .chips.wkm{margin-top:4px}
.chips.wkm{margin:8px 0 0;align-items:center}
.wkl{font-size:.8rem;font-weight:600;color:var(--muted)}
main>section>.chips.wkm{margin:0 0 8px}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.day.today{background:var(--card);background:color-mix(in srgb,var(--acc) 7%,var(--card));border:2px solid var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 22%,transparent),0 6px 18px color-mix(in srgb,var(--acc) 22%,transparent);margin:14px 0 18px}
.tag.tdy{background:var(--acc);border-color:var(--acc);color:var(--accf);display:inline-flex;align-items:center;gap:6px}
.tag.tdy::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.tabs button.now{box-shadow:inset 0 -3px 0 var(--acc)}
.dh{font-weight:700;margin:0 0 8px;display:flex;gap:8px;align-items:center}
.dh .dt{color:var(--muted);font-weight:500;font-size:.9rem}
.avb{margin-left:auto;font:inherit;font-size:.78rem;font-weight:600;color:var(--muted);background:none;border:1px solid var(--line);border-radius:99px;padding:3px 9px;cursor:pointer;white-space:nowrap}
.avhm{display:flex;gap:4px;flex:1 1 auto;min-width:0}
.fld .avhm{flex:0 0 auto}
.fld .avhm select{width:auto}
.avb.cut{color:var(--ac);border-color:var(--ac)}
.avb:focus-visible{outline:3px solid var(--f);outline-offset:2px}
.avb+.add{margin-left:6px}
.avin{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:6px;font-size:.78rem;font-weight:500;color:var(--muted)}
.avin select{font:inherit;padding:4px 6px;text-align:left;text-align-last:left;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text)}
.add{margin-left:auto;flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--sub);color:var(--text);font:inherit;font-size:1.3rem;font-weight:600;line-height:1;padding:0}
.add:focus-visible,.edit:focus-visible{outline:3px solid var(--f);outline-offset:2px}
.it{background:var(--sub);border-left:6px solid var(--r);border-radius:8px;padding:8px 10px}
.it{position:relative}.it.hasck>.it-t{padding-right:30px}.it.hasck>.edit{margin-right:30px}
.it+.it{margin-top:8px}
.it.f{border-left-color:var(--f)}.it.l{border-left-color:var(--l)}.it.s{border-left-color:var(--s)}.it.w{border-left-color:var(--w)}.it.k{border-left-color:var(--k)}.it.k .it-t{color:var(--kt)}.it.k .stl .rb{border-left-color:var(--k)}
.it.f .it-t{color:var(--ft)}.it.l .it-t{color:var(--lt)}.it.s .it-t{color:var(--st)}.it.w .it-t{color:var(--wt)}
.it-t{font-weight:700}
.it-t .dur{font-weight:500;font-size:.85rem;color:var(--muted);white-space:nowrap}
.it.clk{cursor:pointer}
.it.clk:hover{outline:1px solid var(--line)}
.it.clk:focus-visible{outline:3px solid var(--f);outline-offset:2px}
.advice{margin:6px 0 10px;padding:8px 10px;border-radius:8px;background:var(--hi);border:1px dashed var(--ac)}
.advice b{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ac)}
.advice p{margin:2px 0 0!important;color:var(--text)!important;font-size:.88rem!important}
.autol{display:inline-flex;flex-wrap:wrap;gap:0 6px;align-items:baseline;margin:3px 0 2px;padding:2px 8px;border-radius:6px;border:1px solid var(--ac);color:var(--ac);font-size:.75rem;font-weight:700}
.autol span{font-weight:500}
.chk{position:absolute;top:8px;right:10px;width:22px;height:22px;margin:0;display:flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid var(--muted);background:none;color:#fff;font:inherit;font-size:.8rem;font-weight:800;line-height:1;padding:0;cursor:pointer}
.chk.ok{background:var(--ok);border-color:var(--ok)}
.it .chk.ok,.it .chk.sk{color:#fff}
.chk.sk{background:var(--no);border-color:var(--no)}
.chk:focus-visible{outline:3px solid var(--f);outline-offset:2px}
.lgb{clear:left;display:inline-block;margin:4px 0 2px;font-size:.78rem;font-weight:700;padding:1px 8px;border-radius:6px}
.lgb.ok{color:var(--okt);border:1px solid var(--ok)}
.lgb.sk{color:var(--not);border:1px solid var(--no)}
.lgb.pend{color:var(--ac);border:1px dashed var(--ac)}
.lgb.ckp{float:right;clear:right;margin:26px -4px 4px 10px;white-space:nowrap;background:var(--card)}
.it.pendk>.chk{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}


.it.skipd>:not(.chk):not(.lgb){opacity:.7}.it>.chk{z-index:2}.it .dd{clear:right}.it.skipd{background:color-mix(in srgb,var(--c) calc(var(--tint) * .5),var(--card))}
.pastl{margin-left:auto;font-size:.78rem;color:var(--muted)}
.fitb{display:inline-block;margin-top:8px;font:inherit;font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.edit{float:right;margin-left:8px;font:inherit;font-size:.8rem;font-weight:600;padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.dd{color:var(--muted);font-size:.93rem;margin-top:2px}
.dd b{color:var(--text);font-weight:600}
.sth{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin:4px 0 2px}
.stl{list-style:none;margin:4px 0 0;padding:0;counter-reset:s}
.stl li{padding:3px 0;line-height:1.4}
.stl li.st{counter-increment:s;display:flex;gap:8px;align-items:flex-start}
.stl li.st::before{content:"";flex:0 0 6px;width:6px;height:6px;margin-top:.55em;border-radius:50%;background:var(--muted)}
.stl li.rep::before{align-self:center;margin-top:0}
.sgrp{margin-top:6px;padding:6px 10px 6px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.sgrp+.sgrp{margin-top:8px}
.sgh{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text)}
.stl .rx{font-weight:700;color:var(--text);min-width:2.2em;align-self:center}
.stl .rb{flex:1;border-left:3px solid var(--muted);padding:2px 0 2px 10px}
.it.f .stl .rb,.alt .stl .rb{border-left-color:var(--f)}.it.l .stl .rb{border-left-color:var(--l)}.it.s .stl .rb{border-left-color:var(--s)}.it.w .stl .rb{border-left-color:var(--w)}
.stl .rr{font-size:.88rem}
.stf{margin-top:4px;font-size:.85rem;font-weight:600;color:var(--text)}
.snote{margin-top:4px;font-size:.85rem;font-style:italic}
.alt .dd{color:inherit;margin-top:2px}
.alt .dd b{color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:.85rem;font-weight:600;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:2px 8px}
.alt{margin-top:8px;padding:6px 8px;border:1px dashed var(--f);border-radius:6px;font-size:.9rem;color:var(--muted)}
.alt b{color:var(--ft)}
.aform{margin-top:10px;border:1px dashed var(--ac);border-radius:10px;padding:10px}
html.mopen{overflow:hidden}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(8,12,16,.55)}
.mbox{width:100%;max-width:460px;max-height:calc(100vh - 32px);overflow:auto;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--acc);border-radius:14px;padding:16px 16px 12px;box-shadow:0 16px 48px rgba(0,0,0,.4)}
.mbox .aform{margin:0;border:0;padding:0}
.mbox .aft{font-size:1.1rem;margin:0 0 12px;color:var(--text)!important}.mbox .fld{display:block;margin:0 0 12px}.mbox .fld>label{display:block;margin:0 0 4px}.mbox .fld>select,.mbox .fld>input{width:100%;max-width:none;text-align:left;text-align-last:left}.mbox .fld .avhm{width:100%}.mbox .fld .avhm select{flex:1}
.mbox .btn{margin-top:6px}
.aform .aft{font-weight:700;margin:0 0 8px}
.aform p{font-size:.88rem;color:var(--muted);margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.card h2{font-size:1.05rem;margin:0 0 6px}
.card h3{font-size:.95rem;margin:12px 0 6px}
.card p{margin:0 0 8px;font-size:.92rem;color:var(--muted)}
.card li{margin:0 0 6px;font-size:.95rem}
.card ul{margin:0;padding-left:1.1rem}
.fld{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.fld label{font-weight:600}
.fld.sub label{font-weight:500;color:var(--muted);font-size:.9rem}
.fld input,.fld select{width:7.5rem;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);text-align:right}

function fillNeed(){
  var N=weekNeed();if(!N)return false;var t=TPL.map(function(s){return s.slice()}),ultra=N.g.type==="trailrun"||numf(N.g.dist)>43,added=false;
  function isRest(d){return !t[d].length||t[d].every(function(x){return x==="rust"})}
  function nRest(){return t.filter(function(s,d){return isRest(d)}).length}
  function hard(d){return d>=0&&d<7&&t[d].some(function(x){return KEYS.indexOf(x)>=0})}
  function hardSp(d,sp){return d>=0&&d<7&&t[d].some(function(x){return KEYS.indexOf(x)>=0&&(SP[x]===sp||SP[x]==="b"&&sp!=="s"||sp==="b"&&(SP[x]==="f"||SP[x]==="l"))})}
  function place(k){
    var sp=SP[k],hk=KEYS.indexOf(k)>=0,best=-1,bs=1e9;
    for(var d=0;d<7;d++){
      var s=t[d],rest=isRest(d),sc;
      if(rest){if(nRest()<=1)continue;sc=4}else{if(s.length>=3)continue;sc=s.length*2}
      if(!rest&&s.some(function(x){var q=SP[x];return q===sp||q==="b"&&(sp==="f"||sp==="l")||sp==="b"&&(q==="f"||q==="l")}))continue;
      if(hk){if(hardSp(d-1,sp)||hardSp(d+1,sp))sc+=5;if(hard(d))sc+=3}
      else if(hard(d))sc+=2;
      if(/^kr/.test(k)&&(t[(d+1)%7].some(function(x){return RQ.indexOf(x)>=0||x==="ll"||x==="ltl"})))sc+=3;
      if((k==="ll"||k==="ltl"||k==="fl")&&d>=5)sc-=3;
      if(sc<bs){bs=sc;best=d}
    }
    if(best<0)return false;
    if(isRest(best))t[best]=[];t[best].push(k);added=true;return true;
  }
  function pr(q){return q.pref?5:q.keys.indexOf("ll")>=0||q.keys.indexOf("fl")>=0&&q.keys.length===1?1:q.keys[0]==="br"?2:q.q?3:4}
  N.R.slice().sort(function(a,b){return pr(a)-pr(b)}).forEach(function(q){
    if(q.keys[0]==="__rest")return;
    q.n=t.reduce(function(a,s){return a+s.filter(function(x){return q.keys.indexOf(x)>=0}).length},0);if(q.n>=q.min)return;
    if(q.keys[0]==="zq"&&q.keys.length===3){q.keys.forEach(function(z){if(q.n<q.min&&!t.some(function(s){return s.indexOf(z)>=0})&&place(z))q.n++});return}
    var k=q.fk?q.fk:q.keys===RQ?"lq":q.keys.indexOf("ll")>=0?(ultra?"ltl":"ll"):q.keys.indexOf("lh")>=0?"lh":q.keys.indexOf("fl")>=0&&q.keys.length===1?"fl":q.keys===BQ?"fq":q.keys.indexOf("kr")>=0?(ultra?"kre":"kr"):q.keys.indexOf("ww")>=0?"fr":q.keys[0];
    if(k==="fq"){for(var d=0;d<7&&q.n<q.min;d++){var i=t[d].indexOf("ww");if(i>=0&&!hardSp(d-1,"f")&&!hardSp(d+1,"f")){t[d][i]="wwq";q.n++;added=true}}}
    for(var m=q.n;m<q.min;m++)if(!place(k))break;
  });
  if(added){TPL=t;saveG();refresh()}
  return added;
}

  }))+'</details></div>';
  return h;
}
/* SVG-grafieken */
function niceMax(m){if(m<=0)return 1;var e=Math.pow(10,Math.floor(Math.log10(m))),f=m/e;return(f<=1?1:f<=2?2:f<=3?3:f<=4?4:f<=5?5:f<=6?6:f<=8?8:10)*e}
function rTop(x,y,w,h,r){r=Math.min(r,h,w/2);return 'M'+x+','+(y+h)+'V'+(y+r)+'Q'+x+','+y+' '+(x+r)+','+y+'H'+(x+w-r)+'Q'+(x+w)+','+y+' '+(x+w)+','+(y+r)+'V'+(y+h)+'Z'}
var ML=40,MR=6;
function xLabels(n,pw,H,mb){
  var step=Math.ceil(n/Math.max(4,Math.floor(pw/34))),h='';
  for(var i=0;i<n;i+=step)h+='<text class="ax" x="'+(ML+(i+.5)*pw/n)+'" y="'+(H-mb+15)+'" text-anchor="middle">'+(i+1)+'</text>';
  return h;
}
var HID=0;
function hatchDefs(id){return '<defs><pattern id="'+id+'" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="5" fill="var(--card)"/></pattern></defs>'}
function barsSvg(W,vals,cols,fmtV){
  var n=vals.length,H=178,mt=16,mb=22,pw=W-ML-MR,ph=H-mt-mb;
  var tot=vals.map(function(v){return v.reduce(function(a,b){return a+b},0)}),mx=niceMax(Math.max.apply(null,tot));
  var sw=pw/n,bw=Math.max(3,Math.min(20,sw*.66)),hid='hatch'+(++HID),h='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Staafgrafiek per week">'+hatchDefs(hid);
  for(var g=0;g<=4;g++){var y=mt+ph-ph*g/4;h+=(g?'<line class="gl" x1="'+ML+'" x2="'+(W-MR)+'" y1="'+y+'" y2="'+y+'"/>':'')+'<text class="ax" x="'+(ML-6)+'" y="'+(y+4)+'" text-anchor="end">'+fmtV(mx*g/4)+'</text>'}
  vals.forEach(function(v,i){
    var x=ML+i*sw+(sw-bw)/2,y0=mt+ph,top=-1;
    v.forEach(function(val,j){if(val>0)top=j});
    v.forEach(function(val,j){
      if(!(val>0))return;
      var hh=val/mx*ph,y=y0-hh,gap=j===top?0:2,d=j===top?rTop(x,y,bw,Math.max(.5,hh),4):'M'+x+','+(y+gap)+'h'+bw+'v'+Math.max(0,hh-gap)+'h'+(-bw)+'Z';
      if(j===top||hh>gap)h+='<path d="'+d+'" fill="var('+cols[j]+')"/>';
      if(lite(WK[i]))h+='<path d="'+d+'" fill="url(#'+hid+')"/>';
      y0=y;
    });
  });
  h+='<line class="bl" x1="'+ML+'" x2="'+(W-MR)+'" y1="'+(mt+ph)+'" y2="'+(mt+ph)+'"/>'+xLabels(n,pw,H,mb);
  var nx=nowX(W);if(nx!==null)h+='<line class="nowl" x1="'+nx+'" x2="'+nx+'" y1="'+(mt-4)+'" y2="'+(mt+ph)+'"/><text class="ax nowt" x="'+nx+'" y="'+(mt-6)+'" text-anchor="middle">vandaag</text>';
  for(var i=0;i<n;i++)h+='<rect class="hit" data-i="'+i+'" tabindex="0" x="'+(ML+i*sw)+'" y="'+mt+'" width="'+sw+'" height="'+ph+'"/>';
  return h+'</svg>';
}
function phaseSvg(W){
  var n=WK.length,H=46,pw=W-ML-MR,sw=pw/n,hid='hatch'+(++HID),h='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Fases per week">'+hatchDefs(hid);
  WK.forEach(function(w,i){
    var x=ML+i*sw,c='var(--p'+PHO.indexOf(w.ph||"basis")+')';
    var nx=WK[i+1],gp=(nx&&(nx.ph||"basis")!==(w.ph||"basis"))?3:1,bw2=Math.max(1,sw-gp);
    h+='<rect x="'+(x+.5)+'" y="12" width="'+bw2+'" height="20" fill="'+c+'"/>';
    if(lite(w))h+='<rect x="'+(x+.5)+'" y="12" width="'+bw2+'" height="20" fill="url(#'+hid+')"/>';
    if(w.tag==="Wedstrijdweek"||w.ph==="race"||/Trailweek/.test(w.tag))h+='<path d="M'+(x+sw/2-4)+',2 h8 l-4,7 z" fill="var(--text)"/>';
    h+='<rect class="hit" data-i="'+i+'" tabindex="0" x="'+x+'" y="0" width="'+sw+'" height="34"/>';
  });
  var nx=nowX(W);if(nx!==null)h+='<line class="nowl" x1="'+nx+'" x2="'+nx+'" y1="9" y2="35"/>';
  return h+xLabels(n,pw,H+2,0).replace(/y="(\d+(\.\d+)?)"/g,'y="44"')+'</svg>';
}
function drawCharts(){
  var cs=view.querySelectorAll(".chart[data-c]");if(!cs.length)return;
  var st=WK.map(weekStats);
  var lg=document.getElementById("phlgd");
  if(lg){var ps=PHO.filter(function(p){return WK.some(function(w){return(w.ph||"basis")===p})});
    lg.innerHTML=ps.map(function(p){return '<span><i style="background:var(--p'+PHO.indexOf(p)+')"></i>'+PHN[p]+'</span>'}).join("")+'<span><i class="h" style="background-color:var(--muted)"></i>Rust- of testweek</span><span>▼ Wedstrijd</span>'}
  for(var i=0;i<cs.length;i++){
    var c=cs[i],k=c.getAttribute("data-c"),W=Math.max(300,Math.round(c.clientWidth||600)),svg;
    if(k==="ph")svg=phaseSvg(W);
    else if(k==="bk")svg=barsSvg(W,st.map(function(s){return[s.bk]}),["--f"],nk);
    else if(k==="rn")svg=barsSvg(W,st.map(function(s){return[s.rn]}),["--l"],nk);
    else if(k==="sw")svg=barsSvg(W,st.map(function(s){return[s.sw]}),["--s"],function(v){return v>=1000?nl(Math.round(v/100)/10)+"k":nk(v)});
    else if(k==="ld")svg=barsSvg(W,WK.map(function(w){return[w.lw?0:w.load,w.lw?w.load:0]}),["--acc","--ac"],nk);
    else svg=barsSvg(W,st.map(function(s){return[s.f,s.l,s.s]}),["--f","--l","--s"],function(v){return nl(Math.round(v*10)/10)+"u"});
    c.innerHTML=svg+'<div class="tip" hidden></div>';
    bindTip(c,k,st);
  }
}
function tipHtml(k,i,s){
  var w=WK[i],hd='<b>Week '+(i+1)+' · '+w.n+'</b>'+PHN[w.ph||"basis"]+(w.tag&&w.tag!==PHN[w.ph]?' · '+esc(w.tag):'')+'<br>';
  if(k==="ph")return hd+(w.note?esc(w.note.length>90?w.note.slice(0,88)+"…":w.note):"");
  if(k==="bk")return hd+'Fietsen: '+nk(s.bk)+' km';
  if(k==="rn")return hd+'Hardlopen: '+nk(s.rn)+' km';
  if(k==="sw")return hd+'Zwemmen: '+fmtM(s.sw)+' m';
  if(k==="ld")return hd+'Belasting: '+nk(w.load)+(w.lw?'<br><b>'+w.lw+'% boven de weken ervoor</b>':'');
  return hd+'Fietsen: '+hm(s.f)+'<br>Hardlopen: '+hm(s.l)+(s.s?'<br>Zwemmen: '+hm(s.s):'')+(s.r?'<br>Kracht en overig: '+hm(s.r):'')+'<br><b>Totaal: '+hm(s.t)+'</b>';
}
function bindTip(c,k,st){
  var tip=c.querySelector(".tip"),hs=c.querySelectorAll(".hit");
  function on(e){
    var r=e.currentTarget,i=+r.getAttribute("data-i"),cb=c.getBoundingClientRect(),rb=r.getBoundingClientRect();
    tip.innerHTML=tipHtml(k,i,st[i]);tip.hidden=false;
    var x=rb.left-cb.left+rb.width/2,tw=tip.offsetWidth||160;
    tip.style.left=clamp(x-tw/2,0,Math.max(0,c.clientWidth-tw))+"px";
    tip.style.top=(k==="ph"?48:-6)+"px";
    if(k!=="ph")tip.style.transform="translateY(-100%)";
  }
  function off(){tip.hidden=true}
  for(var j=0;j<hs.length;j++){["mouseenter","focus","click"].forEach(function(ev){hs[j].addEventListener(ev,on)});["mouseleave","blur"].forEach(function(ev){hs[j].addEventListener(ev,off)})}
}
var rsz=null;
window.addEventListener("resize",function(){if(cur!=="opb")return;clearTimeout(rsz);rsz=setTimeout(drawCharts,120)});
function show(sel,first){
  
  if(typeof sel==="number"&&WK.length){sel=clamp(sel,0,WK.length-1);wsel=sel}
  cur=sel;mark();
  if(sel==="set"){view.innerHTML=setView();setFold()}
  else if(sel==="opb"){view.innerHTML=opbView();ovFold();drawCharts()}
  else if(sel==="race"){view.innerHTML=raceView();bindRace()}
  else if(sel==="done"){view.innerHTML=doneView();bindDone()}
  else if(sel==="help"){view.innerHTML=helpView();hFold()}
  else if(sel==="zones"){view.innerHTML='<div id="zout">'+ztables()+'</div>';[["Fietsen","sb"],["Hardlopen","sr"],["Zwemmen","ss"]].forEach(function(z){if(V[z[1]])return;view.querySelectorAll("#zout .card").forEach(function(c){var h=c.querySelector("h2");if(h&&h.textContent.indexOf(z[0])===0)c.remove()})});if(!V.sr){var wn=view.querySelector("#zout > .warn");if(wn)wn.remove()}if(!V.sb&&!V.sr&&!V.ss)view.innerHTML='<div class="card"><p>Kies bij Gebruikersinstellingen, onder Startsituatie, welke sporten je doet.</p></div>';zFold()}
  else if(WK[sel]){view.innerHTML=week(sel)+(DR?'<div class="modal" id="amodal"><div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mtitle">'+aform().replace('<p class="aft">','<p class="aft" id="mtitle">')+'</div></div>':'');bindWeek()}
  else view.innerHTML='<div class="card"><p>Er is nog geen schema. Voeg een doel toe bij Gebruikersinstellingen.</p></div>';
  if(typeof sel==="string"&&sel!=="opb"&&sel!=="race"&&sel!=="done"&&sel!=="zones")bindAll();
  if(typeof sel==="string")decorate();
  var mo=document.getElementById("amodal");document.documentElement.classList.toggle("mopen",!!mo);
  if(mo){mo.addEventListener("click",function(e){if(e.target===mo){DR=null;show(wsel)}});var f0=mo.querySelector("select,input,button");if(f0&&f0.focus)f0.focus({preventScroll:true})}
  if(first){
    var t=view.querySelector(".today");
    if(t)t.scrollIntoView({block:"center"});
    var tb=tabs.children;
    for(var j=0;j<tb.length;j++)if(tb[j].getAttribute("aria-pressed")==="true")tb[j].scrollIntoView({inline:"center",block:"nearest"});
  }
}
loadS();loadG();loadL();calc();plan();raceList();
var start=0;
WK.forEach(function(w,i){var d=diffDays(w);if(d>=0)start=i});
wsel=start;cur=WK.length?start:"set";
buildTabs();
show(cur,true);
</script>
