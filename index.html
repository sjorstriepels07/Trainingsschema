.range{font-weight:600;margin:0 0 4px}
.note{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:var(--fs-b);margin:0 0 10px}

.wkt{margin-top:8px}.avn{margin-top:10px}.avn>b{display:block;font-size:var(--fs-s);color:var(--text);font-weight:600}.avn ul{margin:4px 0 0;padding-left:1.2rem;font-size:var(--fs-b)}.avn li{margin:2px 0}.avn li b{display:inline;font-size:inherit;color:inherit;font-weight:600}.avn ul.avs{margin:2px 0 4px;padding-left:1.4rem;list-style:'– '}.wkh{font-size:var(--fs-s);color:var(--muted)}.wkh b{display:inline;color:var(--text);font-weight:600}.wkt .chips.wkm{margin-top:4px}

.tabs button.now{box-shadow:inset 0 -3px 0 var(--acc)}

.day,.note{overflow-wrap:anywhere;min-width:0;scroll-margin-top:calc(var(--sh,110px) + 24px)}

/* ===================== APPLE-STIJL (Human Interface Guidelines) – geldt voor alles, ook voor alles wat erbij komt =====================
   Opbouw: menu onderin (zwevende balk, max. 5 knoppen, icoon + label) · grote titel per pagina (34 pt, vet, links) · grijze subregel.
   Kleuren: systeemkleuren van Apple. Fietsen blauw, hardlopen rood, zwemmen oranje, kracht geel, wedstrijd bruin, rust grijs.
     Accent en knoppen blauw (--f). Groen = gedaan/aan/vandaag-beschikbaar. Oranje = let op. Rood = ontbreekt / nog doen.
   Vlakken: grijze achtergrond (--bg), witte kaarten (--card) met ronde hoeken (--rad), geen randen, geen gekleurde zijbalken.
     Binnen een kaart: lichtgrijze vulling (--sub / --fill). Scheidingslijnen dun (0,5 px, --sep).
   Iconen: eigen lijn-iconen in een gekleurd afgerond vierkantje (.isq), geen emoji in titels of knoppen.
   Knoppen: capsule. Primair = blauw vlak met witte tekst; secundair = grijze vulling met blauwe tekst. Aanraakvlak ≥ 44 px.
   Letter: systeemletter (San Francisco op Apple). Grootte: --fs-lt 34 titel · --fs-xl 22 kengetal · --fs-h 17 kop (600) ·
     --fs-b 16 tekst · --fs-s 13 uitleg en sectiekoppen. Sectiekoppen boven een groep: klein, grijs, hoofdletters.
   Lijsten: opsommingstekens (ul), uitleg als ul.exl in --fs-s. Eenheden in labels tussen [ ]. Uitklappen met een chevron (› / ⌄).
   ======================================================================================================================================= */

--acc:#34C759;--acct:#248A3D;--accf:#FFFFFF;--gon:#34C759;--gonf:#FFFFFF;--ok:#34C759;--okt:#248A3D;--no:#FF3B30;--not:#D70015;--ac:#FF9500;--hi:#FFF4E5;--nt:#5856D6;
--p0:#34C759;--p1:#FF9500;--p2:#30B0C7;--p3:#FF3B30;--p4:#007AFF;--tint:10%;--hdbg:transparent;--hdtx:#000000;--hdsub:#6C6C70;--hdpb:#C6C6C8;
--glass:rgba(249,249,251,.86);--glassb:rgba(0,0,0,.08);--rad:20px;--rad2:12px;

--acc:#30D158;--acct:#30D158;--accf:#FFFFFF;--gon:#30D158;--gonf:#FFFFFF;--ok:#30D158;--okt:#30D158;--no:#FF453A;--not:#FF6961;--ac:#FF9F0A;--hi:#2E2410;--nt:#5E5CE6;

/* ===== weekkeuze onderin, boven het menu ===== */
.wkdock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 24px));z-index:39;border-radius:22px;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);border:.5px solid var(--glassb);box-shadow:0 6px 24px rgba(0,0,0,.12);padding:5px}

.wkdock .tabs button{display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:0;min-width:46px;min-height:44px!important;padding:4px 8px!important;border-radius:16px!important;background:transparent!important;line-height:1.1}

.wkdock .tabs button[aria-pressed="true"]{background:var(--f)!important;color:#fff!important}.wkdock .tabs button[aria-pressed="true"] span,.wkdock .tabs button[aria-pressed="true"] b{color:#fff}
.wkdock .tabs button.now::before{display:none}.wkdock .tabs button.now:not([aria-pressed="true"]) b{color:var(--f)}
.wkdock #tabs button.need::after{top:2px;right:2px}

main{padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))!important}
.pg-week .day,.pg-week .note{scroll-margin-top:16px}
/* oude symbolen als iconen */
.emq,.emi{display:inline-grid;place-items:center;vertical-align:-3px;margin-right:4px}
.emq{width:18px;height:18px;border-radius:5px;background:var(--q);color:#fff}.emq svg{width:12px;height:12px}
.smiss li a{display:flex;align-items:center;gap:10px}.smiss .emq{width:30px;height:30px;border-radius:8px;flex:none;margin:0}.smiss .emq svg{width:18px;height:18px}
.emi{color:var(--q)}.emi svg{width:15px;height:15px}
.isq svg,.emq svg,.emi svg{display:block}
/* triatlon en trail */
.q-tr{--q:var(--l)}.q-tri{--q:linear-gradient(135deg,var(--s) 0 33%,var(--f) 33% 66%,var(--l) 66%)}
.rhero .isq{position:absolute;right:18px;bottom:16px;width:36px;height:36px;background:rgba(255,255,255,.22)!important;border-radius:10px}

.rpp{margin:6px 0 8px}
.rpl{display:flex;flex-direction:column;gap:6px;margin:0 0 6px}.rpl div{display:grid;grid-template-columns:12px auto 1fr;align-items:baseline;gap:8px;font-size:var(--fs-s)}
.rpl i{width:10px;height:10px;border-radius:3px;align-self:center}.rpl span{color:var(--muted);white-space:nowrap}.rpl b{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0}
.tile{display:flex;align-items:center;gap:10px;background:var(--sub);border-radius:14px;padding:10px}
.tile .isq{width:30px;height:30px;border-radius:8px}.tile .isq svg{width:17px;height:17px}
.tile span{display:flex;flex-direction:column;min-width:0}.tile em{font-style:normal;font-size:.75rem;color:var(--muted);line-height:1.2}.tile b{font-size:var(--fs-b);font-weight:600;line-height:1.25;font-variant-numeric:tabular-nums}
.tgh{margin:10px 0 0!important;font-size:.75rem!important;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)!important}
.tl{position:relative;height:14px;border-radius:7px;background:color-mix(in srgb,var(--acc) 30%,var(--sub));margin:14px 0 30px}
.tls{position:absolute;left:0;top:0;bottom:0;border-radius:7px 0 0 7px;background:color-mix(in srgb,var(--s) 45%,var(--sub))}
.tlh{position:absolute;top:-4px;bottom:-4px;width:0}.tlh i{position:absolute;left:-1px;top:0;bottom:0;width:2px;background:var(--muted);opacity:.5}.tlh em{position:absolute;top:24px;transform:translateX(-50%);font-style:normal;font-size:.6875rem;color:var(--muted);white-space:nowrap}
.tlf{position:absolute;top:3px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 2px var(--card)}
.tll .tlf{position:static;display:inline-block;margin:0 4px 0 0;vertical-align:0}
.tlp{position:absolute;top:-18px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;color:var(--w)}.tlp svg{width:14px;height:14px}.tlp em{display:none}
.tll{display:flex;gap:14px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}.tll span{display:inline-flex;align-items:center;gap:4px}.tll svg{width:12px;height:12px;color:var(--w)}

.tdyd{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:56px;min-height:44px;border:0;border-radius:16px;background:var(--fill);color:var(--f);font:inherit;font-size:.625rem;font-weight:600;cursor:pointer;padding:0 6px}

.wkinfo{margin:0 0 12px}.wkinfo .lrow{cursor:default;min-height:52px}

.npl{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.npr{display:flex;gap:10px;align-items:flex-start;background:var(--sub);border-radius:14px;padding:10px}

.zl{display:flex;flex-direction:column;gap:10px;margin:6px 0 4px}
.zr{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px}
.zr .zp{margin:0;justify-self:start;font-size:.75rem;padding:4px 6px}
.zb{min-width:0}.zbt{display:flex;align-items:baseline;gap:6px;min-width:0}.zbt b{font-size:var(--fs-s);font-weight:600;white-space:nowrap}.zbt em{font-style:normal;font-size:.75rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zb i{display:block;height:6px;border-radius:3px;margin-top:4px}
.zv{text-align:right;font-size:var(--fs-s);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;flex-direction:column}.zv em{font-style:normal;font-weight:400;font-size:.6875rem;color:var(--muted)}

/* Daniels & Gilbert (Daniels' Running Formula): zuurstofkosten bij snelheid v [m/min] en houdbaar % VO2max bij duur t [min] */
function vdotOf(d,t){var m=t/60,v=d/m,vo=-4.6+.182258*v+.000104*v*v,pc=.8+.1894393*Math.exp(-.012778*m)+.2989558*Math.exp(-.1932605*m);return vo/pc}

function vdPace(vd,pc){return 60000/vdV(vd*pc)}
/* voorspelde tijd [s] op d meter bij deze VDOT */
function vdTime(vd,d){var lo=d/1000*120,hi=d/1000*900;for(var i=0;i<50;i++){var m=(lo+hi)/2;if(vdotOf(d,m)>vd)lo=m;else hi=m}return(lo+hi)/2}

function vdOwn(){var b=0;RUNK.forEach(function(k){if(!own(k))return;var t=ttS(k);if(t)b=Math.max(b,vdotOf(TD[k]*1000,t))});return b}
function calc(){
  syncEst();

  var p5=sec(V.p5)||300,p10=sec(V.p10)||315,ph=sec(V.ph)||330,pm=sec(V.pm)||345,cs=sec(V.cs)||120;
  function w(x){return Math.round(f*x)}
  function pw(a,b){return w(a)+"–"+w(b)+" W"}
  T.Bz1=pw(.45,.55);T.Bz2=pw(.56,.75);T.Bz3=pw(.76,.9);T.Bss=pw(.88,.94);T.Bth=pw(.95,1);T.Bz4=pw(.91,1.05);T.Bz5=pw(1.06,1.2);T.Bz6=pw(1.21,1.5);T.Bz1t="tot "+w(.55)+" W";T.Bz7t="vanaf "+w(1.51)+" W";T.Bvo=pw(1.1,1.15);
  T.B95=pw(.93,.97);T.B105=pw(1.03,1.07);T.B120=pw(1.15,1.2);
  if(!ftpOk()){T.Bz1="Z1";T.Bz2="Z2";T.Bz3="Z3";T.Bss="sweet spot";T.Bth="drempel";T.Bz4="Z4";T.Bz5="Z5";T.Bz6="Z6";T.Bz1t="Z1";T.Bz7t="Z7";T.Bvo="Z5";T.B95=T.B105=T.B120="drempel"}
  T.Ez1=T.Bz1;T.Ez2=T.Bz2;T.Ez3=T.Bz3;T.Ess=T.Bss;T.Eth=T.Bth;T.Evo=T.Bvo;
  /* loopzones volgens Daniels (VDOT): Z1 herstel 59–65%, Z2 E 65–74%, Z3 M (marathontempo), Z4 T 86–88%, Z5 I 95–100% van VDOT */
  var VD=vdOwn()||vdotOf(5000,p5*5),PC=function(x){return Math.round(vdPace(VD,x))},pM=Math.round(vdTime(VD,42195)/42.195);T.vdot=Math.round(VD*10)/10;
  T.Rz1=rg(PC(.65),PC(.59));T.Rz2=rg(PC(.74),PC(.65));T.Rz3=rg(pM-5,pM+5);T.Rz4=rg(PC(.88),PC(.86));T.Rz5=rg(PC(1),PC(.95));T.prR=PC(1)-15;T.Rr=rg(PC(1)-18,PC(1)-12);
  T.Rlong=rg(PC(.70),PC(.62));T.Rb2b=rg(PC(.68),PC(.60));
  T.Sz1=rs(cs+15,cs+25);T.Sz2=rs(cs+7,cs+14);T.Sz3=rs(cs+3,cs+6);T.Sz4=rs(cs-1,cs+2);T.Sz5=rs(cs-6,cs-2);
  T.ordered=(p5<p10&&p10<ph&&ph<pm);
  T.pr1=PC(.62);T.pr3=pM;T.pr4=PC(.87);T.pr5=PC(.975);
  /* duurberekening: afgeleid van je eigen waarden */
  var kgv=numf(V.kg),P=.65*f*.97,lo=1,hi=20;for(var it=0;it<40;it++){var mv=(lo+hi)/2;if(.192*mv*mv*mv+.005*((kgv>0?kgv:75)+10)*9.81*mv>P)hi=mv;else lo=mv}T.vb=Math.round(lo*3.6*.92*2)/2;
  T.pz1=PC(.62);T.pz2=PC(.695);T.plg=PC(.66);T.pq=Math.round((2*PC(.695)+PC(.87))/3);T.psw=Math.round((cs+10)*1.15);
  /* hartslagzones (lopen, % van drempelhartslag) */
  /* hartslagzones zoals Garmin standaard: % van je maximale hartslag */

  function hr(a,b){return Math.round(hm*a)+"–"+Math.round(hm*b)+" bpm"}
  var lt=parseInt(V.lthr,10);
  if(lt>0){/* Friel: % van drempelhartslag (lopen) Z1 <85, Z2 85–89, Z3 90–94, Z4 95–99, Z5 100–106 */var f=function(a,b){return Math.round(lt*a)+"–"+Math.round(lt*b)+" bpm"};T.Hz1="tot "+Math.round(lt*.84)+" bpm";T.Hz2=f(.85,.89);T.Hz3=f(.9,.94);T.Hz4=f(.95,.99);T.Hz5=f(1,1.06)}
  else if(hm){T.Hz1=hr(.5,.6);T.Hz2=hr(.6,.7);T.Hz3=hr(.7,.8);T.Hz4=hr(.8,.9);T.Hz5=hr(.9,1)}else{T.Hz1=T.Hz2=T.Hz3=T.Hz4=T.Hz5=""}
  /* hoogtemeters per km uit het (hoofd)doel voor trail */
  var tg=null;(typeof G!=="undefined"?G:[]).forEach(function(g){if(g.type==="trailrun"&&numf(g.hm)>0&&numf(g.dist)>0&&(!tg||g.prio==="A"))tg=g});
  var ratio=tg?numf(tg.hm)/numf(tg.dist):20;
  for(var k=1;k<=60;k++)T["HM"+k]=ratio?" met ca. "+fmtM(Math.max(50,Math.round(k*ratio/50)*50))+" hoogtemeters":" met hoogtemeters";
}

function bset(b,z,e){var P=e?z[2]:z[1],Z1=e?"{Ez1}":"{Bz1}",v=b[3];
  if(v==="pyr")return b[1]+" min op "+P+", "+b[2]+" min op "+Z1+", "+(b[1]-2)+" min op "+P+", "+b[2]+" min op "+Z1+", "+(b[1]-4)+" min op {B105}";

  if(v==="brst")return b[0]+"×2 min op "+P+" met telkens 20 sec op {B120} erna";
  if(v==="3015"||v==="3030"||v==="4020"){var on=v==="4020"?40:30,off=v==="3015"?15:60-on,set=b[1]+"×"+on+" sec op {B120} met "+off+" sec op "+Z1+" ertussen",a=[];for(var i=0;i<b[0];i++)a.push(set);return a.join(", "+b[2]+" min op "+Z1+", ")}
  return b[0]+"×"+b[1]+" min op "+P+", "+b[2]+" min op "+Z1+" ertussen";
}
function bmin(b){var v=b[3];if(v==="3015")return 25+Math.round(b[0]*b[1]*.75)+(b[0]-1)*b[2];if(v==="pyr")return 25+3*b[1]-6+2*b[2];if(v==="brst")return 25+Math.round(b[0]*7/3);return 25+b[0]*b[1]+(b[0]-1)*b[2]}
function bQ(t,b){var z=BZ[t],m=bmin(b),x=F("Fietsen: "+z[3],m+" min: 15 min warm-up op {Bz2}, "+bset(b,z)+", 10 min cooldown op {Bz2}",[z[0],b[3]==="3015"||b[3]==="3030"||b[3]==="4020"?"{B120}":z[1]],""+m+" min: 15 min op {Ez2}, "+bset(b,z,1)+", 10 min op {Ez2}",Math.round(m*.5));x[15]={t:t,b:b};return x}

var CM=["ww","cm"],CMV=["ww","cmv"];

function cmTxt(h,t){return !t?"Heenweg "+nl(h)+" km":(!h?"Terugweg "+nl(t)+" km":(h===t?"2×"+nl(h)+" km":"Heenweg "+nl(h)+" km en terugweg "+nl(t)+" km"))}

}

var OU=F("Fietsen: over-unders","75 min: 15 min warm-up op {Bz2}, 3×12 min met afwisselend 2 min op {B95} en 1 min op {B105}, 5 min op {Bz1} tussen de blokken, 14 min cooldown op {Bz2}",["Z4 drempel","{B95} en {B105}"],"Zelfde opbouw, 2 min op {B95} en 1 min op {B105}, 5 min op {Ez1} tussen de blokken, 14 min op {Ez2}",40);

function tk(min,p){return min*60/(p||300)}
